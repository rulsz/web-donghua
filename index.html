<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Streaming Donghua & Anime</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; margin: 0; padding: 15px; }
    .container { max-width: 1000px; margin: 0 auto; text-align: center; }
    h1 { color: #38bdf8; margin-bottom: 20px; }
    
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
      gap: 12px; 
      margin-top: 20px; 
    }
    .card { 
      background: #1e293b; 
      border-radius: 8px; 
      overflow: hidden; 
      cursor: pointer; 
      transition: transform 0.2s; 
    }
    .card:hover { transform: scale(1.03); }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #334155; }
    .card-title { padding: 8px; font-size: 12px; font-weight: bold; height: 45px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    
    .player-box { margin-top: 20px; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    
    .server-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
    .server-btn { background: #334155; border: 1px solid #475569; padding: 8px 14px; border-radius: 4px; color: #fff; cursor: pointer; }
    
    #playerSection { display: none; }
    .back-btn { background: #ef4444; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
    #statusMsg { margin-top: 20px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Katalog Streaming</h1>

    <!-- TAMPILAN PEMUTAR VIDEO -->
    <div id="playerSection">
      <button class="back-btn" onclick="closePlayer()">← Kembali ke Daftar</button>
      <h2 id="videoTitle" style="font-size: 16px; color: #38bdf8;"></h2>
      <div class="server-list" id="serverList"></div>
      <div class="player-box" id="playerBox"></div>
    </div>

    <!-- TAMPILAN KATALOG -->
    <div id="catalogSection">
      <div id="statusMsg">Memuat katalog...</div>
      <div class="grid" id="donghuaGrid"></div>
    </div>
  </div>

  <script>
    window.onload = loadCatalog;

    async function loadCatalog() {
      const status = document.getElementById('statusMsg');
      const grid = document.getElementById('donghuaGrid');

      try {
        // Ambil data langsung dari Jikan API (Public & Stabil)
        const res = await fetch('https://api.jikan.moe/v4/seasons/now?limit=24');
        const data = await res.json();
        
        if (data.data && data.data.length > 0) {
          status.style.display = 'none';
          grid.innerHTML = '';
          data.data.forEach(item => {
            const title = item.title_english || item.title;
            const poster = item.images?.jpg?.large_image_url || item.images?.jpg?.image_url;
            const malId = item.mal_id;

            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => playDonghua(malId, title);
            card.innerHTML = `
              <img src="${poster}" alt="${title}" loading="lazy" />
              <div class="card-title">${title}</div>
            `;
            grid.appendChild(card);
          });
        } else {
          status.innerText = 'Gagal memuat katalog. Coba muat ulang halaman.';
        }
      } catch (err) {
        status.innerText = 'Gagal menghubungi API server.';
      }
    }

    function playDonghua(id, title) {
      document.getElementById('catalogSection').style.display = 'none';
      document.getElementById('playerSection').style.display = 'block';
      document.getElementById('videoTitle').innerText = title;
      
      const serverList = document.getElementById('serverList');
      const playerBox = document.getElementById('playerBox');
      
      serverList.innerHTML = '<button class="server-btn">Server Utama</button>';
      // Embed player universal berbasis MAL ID
      playerBox.innerHTML = `<iframe src="https://vidsrc.to/embed/anime/${id}" allowfullscreen></iframe>`;
    }

    function closePlayer() {
      document.getElementById('playerSection').style.display = 'none';
      document.getElementById('catalogSection').style.display = 'block';
      document.getElementById('playerBox').innerHTML = '';
    }
  </script>
</body>
</html>
