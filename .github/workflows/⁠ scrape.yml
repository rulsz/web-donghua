name: Auto Scrape Anichin

on:
  schedule:
    - cron: '0 */6 * * *' # Jalan otomatis tiap 6 jam
  workflow_dispatch: # Tombol jalankan manual

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run Scraper
        run: node scraper.js

      - name: Commit & Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update data.json [skip ci]" || exit 0
          git push
