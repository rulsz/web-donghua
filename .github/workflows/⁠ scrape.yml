name: Auto Scrape Anichin

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install express cheerio axios cors puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run Scraper Script
        run: |
          TARGET_FILE=$(find . -maxdepth 2 -iname "*scraper*.js" | head -n 1)
          if [ -n "$TARGET_FILE" ]; then
            echo "Menjalankan file: $TARGET_FILE"
            node "$TARGET_FILE"
          else
            echo "File scraper tidak ditemukan!"
            exit 1
          fi

      - name: Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto update data.json [skip ci]" || exit 0
          git pull --rebase --autostash origin main
          git push
