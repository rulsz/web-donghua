name: Auto Scrape Anichin

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install express cheerio axios cors puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Debug & Run Scraper
        run: |
          echo "=== Cek Daftar File di Repo ==="
          ls -la
          echo "=== Mengesekusi Scraper ==="
          FILE=$(find . -maxdepth 2 -iname "scraper.js" | head -n 1)
          if [ -n "$FILE" ]; then
            echo "File ditemukan di: $FILE"
            node "$FILE"
          else
            echo "File scraper.js benar-benar tidak ditemukan!"
            exit 1
          fi

      - name: Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update data.json [skip ci]" || exit 0
          git push
